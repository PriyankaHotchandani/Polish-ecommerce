name: Sync Inventory

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: inventory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trigger inventory sync endpoint
        env:
          SYNC_BASE_URL: ${{ secrets.SYNC_BASE_URL }}
          INVENTORY_SYNC_SECRET: ${{ secrets.INVENTORY_SYNC_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${SYNC_BASE_URL:-}" ]; then
            echo "SYNC_BASE_URL secret is required"
            exit 1
          fi

          if [ -z "${INVENTORY_SYNC_SECRET:-}" ]; then
            echo "INVENTORY_SYNC_SECRET secret is required"
            exit 1
          fi

          URL="${SYNC_BASE_URL%/}/api/sync/inventory?mode=inventory"

          attempt=1
          max_attempts=3
          success=0

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Attempt $attempt/$max_attempts -> $URL"

            set +e
            http_code=$(curl -sS -o response.json -w "%{http_code}" \
              -X POST "$URL" \
              -H "Authorization: Bearer ${INVENTORY_SYNC_SECRET}" \
              -H "Content-Type: application/json" \
              --connect-timeout 20 \
              --max-time 600)
            curl_exit=$?
            set -e

            if [ -f response.json ]; then
              cat response.json
            fi

            if [ "$curl_exit" -eq 0 ] && [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "Inventory sync succeeded with status $http_code"
              success=1
              break
            fi

            echo "Attempt $attempt failed (curl_exit=$curl_exit, http_code=${http_code:-none})"

            # Retry only for transport failures and transient HTTP statuses.
            if [ "$attempt" -lt "$max_attempts" ]; then
              if [ "$curl_exit" -ne 0 ] || [ "$http_code" -eq 429 ] || [ "$http_code" -ge 500 ]; then
                attempt=$((attempt + 1))
                continue
              fi
            fi

            break
          done

          if [ "$success" -ne 1 ]; then
            echo "Inventory sync failed after $attempt attempt(s)."
            exit 1
          fi
